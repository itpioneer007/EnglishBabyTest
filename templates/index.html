<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语宝自动化检测 - 餐馆经营系统</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#faf7f2;color:#3d3226;min-height:100vh}
:root{--green:#2d6a4f;--green-light:#40916c;--beige:#fefae0;--cream:#faf7f2;--warm:#e9c46a;--warn-light:#fef3c7;--red:#bc4742;--red-light:#fce4e4;--gray:#6b7280;--border:#e5ded5;--white:#fff;--blue:#eff6ff}

/* ===== 顶部 ===== */
.topbar{background:linear-gradient(135deg,var(--green),var(--green-light));color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(45,106,79,.25)}
.topbar .brand{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar .brand span{font-size:12px;opacity:.75;font-weight:400;margin-left:12px}
.topbar .dev-row{display:flex;align-items:center;gap:10px;font-size:13px}
.topbar select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 10px;border-radius:6px;font-size:13px}
.topbar select option{background:var(--green);color:#fff}
.topbar .dot{width:8px;height:8px;border-radius:50%;background:#fbbf24}
.topbar .dot.on{background:#86efac}
.topbar .task-tag{font-size:12px;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.2)}

/* ===== 主布局：左右两栏 ===== */
.main{display:grid;grid-template-columns:420px 1fr;gap:0;min-height:calc(100vh - 58px)}
@media(max-width:960px){.main{grid-template-columns:1fr}}

/* ===== 左栏 — 点菜区 ===== */
.order{background:var(--white);padding:24px;overflow-y:auto;border-right:1px solid var(--border)}

/* 清单输入 */
.order-box{background:var(--cream);border:2px dashed var(--border);border-radius:14px;padding:20px;margin-bottom:20px;transition:border-color .3s}
.order-box:focus-within{border-color:var(--green-light)}
.order-box .order-label{font-size:15px;font-weight:700;color:var(--green);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.order-box .order-hint{font-size:12px;color:var(--gray);margin-bottom:10px;line-height:1.5}
.order-box textarea{width:100%;min-height:120px;border:none;background:transparent;font-size:14px;resize:vertical;font-family:inherit;line-height:1.6;color:#3d3226}
.order-box textarea:focus{outline:none}
.order-box textarea::placeholder{color:#c4b5a5}

/* 快捷配置 */
.config-toggle{cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray);margin-bottom:12px;user-select:none}
.config-toggle:hover{color:var(--green)}
.config-toggle .arrow{transition:transform .2s;font-size:10px}
.config-toggle.open .arrow{transform:rotate(90deg)}
.config-body{overflow:hidden;max-height:0;transition:max-height .3s ease}
.config-body.open{max-height:500px}

.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.config-grid .field{}
.config-grid .field label{display:block;font-size:12px;color:var(--gray);margin-bottom:3px}
.config-grid .field select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--cream);cursor:pointer}
.config-grid .field select:focus{outline:none;border-color:var(--green-light)}

/* 模块标签 */
.module-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.mod-tag{padding:7px 13px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;transition:all .15s;user-select:none;background:var(--cream)}
.mod-tag:hover{border-color:var(--green-light)}
.mod-tag.on{border-color:var(--green);background:#f0fdf4;color:var(--green);font-weight:600}
.mod-tag input{display:none}

/* 解析并开始按钮 */
.btn-cook{width:100%;padding:16px;background:linear-gradient(135deg,var(--green),var(--green-light));color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(45,106,79,.25)}
.btn-cook:hover{box-shadow:0 6px 24px rgba(45,106,79,.35);transform:translateY(-1px)}
.btn-cook:active{transform:scale(.98)}
.btn-cook:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-cook .emoji{font-size:20px}

/* ===== 右栏 — 后厨 + 上菜 ===== */
.kitchen{display:flex;flex-direction:column;background:var(--cream)}

/* 后厨状态条 */
.kitchen-bar{padding:16px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--white)}
.kitchen-bar .pulse{width:10px;height:10px;border-radius:50%;background:var(--gray)}
.kitchen-bar .pulse.running{background:var(--red);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.kitchen-bar .msg{font-size:14px;font-weight:600}
.kitchen-bar .sub{font-size:12px;color:var(--gray);margin-left:auto}

/* 日志区 */
.log-wrap{flex:1;overflow-y:auto;padding:16px 24px}
.log-empty{text-align:center;color:var(--gray);padding:60px 0;font-size:14px;line-height:2}
.log-empty .emoji{font-size:48px;display:block;margin-bottom:12px}

.log-item{font-family:"SF Mono","Cascadia Code",Consolas,monospace;font-size:13px;line-height:1.6;padding:4px 10px;border-radius:4px;margin:1px 0;display:flex;gap:10px;white-space:pre-wrap;word-break:break-all}
.log-item .t{color:var(--gray);min-width:52px;font-size:11px;flex-shrink:0}
.log-item.info{}.log-item.info .t{color:#94a3b8}
.log-item.success{background:#f0fdf4;color:var(--green)}
.log-item.error{background:var(--red-light);color:var(--red)}
.log-item.step{background:var(--blue);color:#1e40af;font-weight:500}
.log-item.warning{background:var(--warn-light);color:#92400e}
.log-clear{text-align:right;padding:0 24px 12px;font-size:12px;color:var(--gray);cursor:pointer}
.log-clear:hover{color:var(--green)}

/* 上菜区（结果） */
.serve-wrap{padding:20px 24px;border-top:1px solid var(--border);background:var(--white);max-height:300px;overflow-y:auto}
.serve-wrap:empty{display:none}
.serve-hdr{font-size:15px;font-weight:700;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:6px}

.serve-cards{display:flex;flex-wrap:wrap;gap:10px}
.serve-card{flex:1;min-width:180px;border:1.5px solid var(--border);border-radius:10px;padding:14px}
.serve-card.ok{border-color:var(--green-light);background:#f0fdf4}
.serve-card.fail{border-color:var(--red);background:var(--red-light)}
.serve-card .sc-name{font-size:13px;font-weight:600;margin-bottom:4px}
.serve-card .sc-stat{display:flex;align-items:baseline;gap:6px}
.serve-card .sc-q{font-size:22px;font-weight:700;color:var(--green)}
.serve-card.fail .sc-q{color:var(--red)}
.serve-card .sc-q small{font-size:13px;font-weight:400;color:var(--gray)}
.serve-card .sc-detail{font-size:11px;color:var(--gray);margin-top:4px}

.serve-summary{font-size:13px;color:var(--gray);text-align:center;margin-top:12px;padding:8px;background:var(--cream);border-radius:8px}

/* 文件上传区 */
.file-hint{font-size:12px;color:var(--green);text-align:center;margin-top:8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.file-hint:hover{color:var(--green-light)}
#fileOrder{display:none}
</style>
</head>
<body>

<!-- ====== 顶部 ====== -->
<div class="topbar">
  <div class="brand">
    🍽 英语宝自动化检测
    <span>餐馆经营系统</span>
  </div>
  <div class="dev-row">
    <span class="dot" id="devDot"></span>
    <span id="devStatus" style="font-size:13px">检测中…</span>
    <select id="devSelect" onchange="selectDevice(this.value)" style="margin-left:6px">
      <option value="">选择设备…</option>
    </select>
    <span class="task-tag" id="taskBadge">—</span>
  </div>
</div>

<!-- ====== 左右两栏 ====== -->
<div class="main">

  <!-- 📋 左栏：点菜下单 -->
  <div class="order">

    <!-- 订单输入 -->
    <div class="order-box">
      <div class="order-label">📝 告诉我们你要测什么</div>
      <div class="order-hint">
        用一段话描述你的检测需求，或者粘贴一个任务清单。比如：<br>
        <em>"帮我检测湘少版五年级上册的听力专项U1的难点突破和口语训练U1"</em><br>
        <em>"测一下单元自检U1-U3和知识过关的U1重点词汇"</em>
      </div>
      <textarea id="orderInput" 
        placeholder="在这里输入你的检测需求，或粘贴任务清单…&#10;&#10;未来上传 Word / Excel 清单也可直接解析。"
        rows="5"></textarea>
    </div>
    <div class="file-hint" onclick="$('fileOrder').click()">📎 或上传任务清单文件（.txt / .docx / .xlsx）</div>
    <input type="file" id="fileOrder" accept=".txt,.docx,.xlsx,.doc,.xls" onchange="uploadOrder(event)">

    <!-- 快捷配置（可折叠） -->
    <div class="config-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
      <span class="arrow">▶</span> 基础配置（也可由清单自动解析）
    </div>
    <div class="config-body open">
      <div class="config-grid">
        <div class="field">
          <label>教材版本</label>
          <select id="setupVersion">
            <option selected>湘少版</option><option>湘鲁版</option><option>人教PEP版</option><option>教科版</option>
          </select>
        </div>
        <div class="field">
          <label>年级</label>
          <select id="setupGrade">
            <option selected>五年级上册</option><option>五年级下册</option><option>六年级上册</option><option>六年级下册</option><option>四年级下册</option><option>三年级下册</option>
          </select>
        </div>
      </div>

      <div style="font-size:13px;color:var(--gray);margin-bottom:6px">要测的模块（可多选）</div>
      <div class="module-tags">
        <label class="mod-tag on"><input type="checkbox" class="mod-sel" value="听力专项" checked>听力专项</label>
        <label class="mod-tag on"><input type="checkbox" class="mod-sel" value="口语训练" checked>口语训练</label>
        <label class="mod-tag on"><input type="checkbox" class="mod-sel" value="单元自检" checked>单元自检</label>
        <label class="mod-tag on"><input type="checkbox" class="mod-sel" value="知识过关" checked>知识过关</label>
        <label class="mod-tag on"><input type="checkbox" class="mod-sel" value="语音评测" checked>语音评测</label>
        <label class="mod-tag on"><input type="checkbox" class="mod-sel" value="巧记单词" checked>巧记单词</label>
        <span style="font-size:12px;color:var(--gray);margin-left:4px">已选 <b id="moduleSelCount">6</b></span>
      </div>
    </div>

    <!-- 开始烹饪 -->
    <button class="btn-cook" id="btnCook" onclick="startCooking()">
      <span class="emoji">🔥</span> 解析清单并开始烹饪
    </button>
    <div style="font-size:12px;color:var(--gray);text-align:center;margin-top:8px">
      点击后后台会分析你的清单，自动调用对应模块开始检测
    </div>
  </div>

  <!-- 🔥 右栏：后厨 + 上菜 -->
  <div class="kitchen" id="kitchenCol">

    <!-- 后厨状态 -->
    <div class="kitchen-bar">
      <span class="pulse" id="kitchenPulse"></span>
      <span class="msg" id="kitchenMsg">后厨空闲，等待下单…</span>
      <span class="sub" id="kitchenSub"></span>
    </div>

    <!-- 日志流 -->
    <div class="log-wrap" id="logWrap">
      <div class="log-empty">
        <span class="emoji">👨‍🍳</span>
        还没有开始烹饪<br>在左侧下单后点"开始烹饪"吧
      </div>
    </div>
    <div class="log-clear" onclick="clearLog()">清空日志</div>

    <!-- 上菜区（结果） -->
    <div class="serve-wrap" id="serveWrap" style="display:none"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id)
let logLast=0,_devListTs=0,_lastLogs=0

// ====== 设备轮询 ======
async function pollStatus(){
  try{
    const s=await(await fetch('/api/status')).json()
    const on=s.device_connected
    $('devDot').className='dot'+(on?' on':'')
    $('devStatus').textContent=on?s.device_serial:'离线'
    const now=Date.now()
    if(now-_devListTs>8000){
      _devListTs=now
      const dl=await(await fetch('/api/devices')).json()
      refreshDevSelect(dl.devices||[], s.device_serial||'')
    }
    const ts=s.task_status||{}
    if(ts.running){
      $('kitchenPulse').className='pulse running'
      $('kitchenMsg').textContent='🔥 烹饪中… '+(ts.current_task||'')
    }else if(!ts.current_task){
      $('kitchenPulse').className='pulse'
      $('kitchenMsg').textContent='后厨空闲，等待下单…'
      $('kitchenSub').textContent=''
    }
    $('taskBadge').textContent=ts.current_task||'空闲'
  }catch(e){}
  setTimeout(pollStatus,2000)
}

function refreshDevSelect(devs,cur){
  const sel=$('devSelect'),focus=cur||sel.value
  sel.innerHTML='<option value="">选择设备…</option>'+
    devs.map(d=>`<option value="${d.serial}" ${d.serial===focus?'selected':''}>${d.serial}</option>`).join('')
}
async function selectDevice(serial){
  try{
    const r=await fetch('/api/device/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serial})})
    const j=await r.json()
    if(j.error){alert('设备选择失败: '+j.error);return}
    addLog('info',j.serial?'已切换设备: '+j.serial+'':'已恢复默认设备')
  }catch(e){alert('设备选择失败: '+e.message)}
}

// ====== 模块标签 ======
function refreshModuleSel(){
  const boxes=[...document.querySelectorAll('.mod-sel')]
  const n=boxes.filter(b=>b.checked).length
  $('moduleSelCount').textContent=n
  boxes.forEach(b=>{const lb=b.closest('.mod-tag');if(lb)lb.classList.toggle('on',b.checked)})
}
document.querySelectorAll('.mod-sel').forEach(b=>b.addEventListener('change',refreshModuleSel))

// ====== 日志 ======
function addLog(level,msg){
  const t=new Date().toLocaleTimeString()
  const el=$('logWrap')
  // 隐藏空状态
  const empty=el.querySelector('.log-empty')
  if(empty) empty.style.display='none'
  el.innerHTML+=`<div class="log-item ${level}"><span class="t">${t}</span>${msg}</div>`
  el.scrollTop=el.scrollHeight
}
function clearLog(){
  $('logWrap').innerHTML='<div class="log-empty"><span class="emoji">👨‍🍳</span>日志已清空</div>'
  $('serveWrap').style.display='none'
}
async function pollLog(){
  try{
    const d=await(await fetch('/api/log')).json()
    const logs=(d.logs||[]).slice(logLast)
    if(logs.length) logLast+=logs.length
    logs.forEach(l=>addLog(l.level,l.msg))
  }catch(e){}
  setTimeout(pollLog,1500)
}

// ====== 文件上传（占位，后端后续支持） ======
function uploadOrder(e){
  const f=e.target.files[0]
  if(!f) return
  addLog('info','📎 已选择任务清单: '+f.name+' ('+(f.size/1024).toFixed(1)+'KB)')
  addLog('step','📋 注：清单文件解析功能即将上线，当前请使用文字描述')
}

// ====== 开始烹饪（多模块检测） ======
async function startCooking(){
  const version=$('setupVersion').value
  const grade=$('setupGrade').value
  const modules=[...document.querySelectorAll('.mod-sel')].filter(b=>b.checked).map(b=>b.value)
  const orderText=($('orderInput').value||'').trim()

  if(!modules.length){alert('请至少选择一个模块（或在清单中说明）');return}

  let confirmMsg = '确认启动多模块检测？\n'
  confirmMsg += `版本: ${version} | 年级: ${grade}\n`
  confirmMsg += `模块: ${modules.join('、')} (共${modules.length}个)`
  if(orderText) confirmMsg += `\n清单描述: "${orderText.substring(0,80)}${orderText.length>80?'…':''}"`
  if(!confirm(confirmMsg)) return

  const btn=$('btnCook')
  btn.disabled=true; btn.innerHTML='<span class="emoji">🔥</span> 烹饪中…'

  // 如果用户写了清单文字，先记录
  if(orderText){
    addLog('step','📝 收到清单: '+orderText.substring(0,200)+(orderText.length>200?'…':''))
  }
  addLog('step','📋 开始分析清单 → 准备调用模块: '+modules.join('、'))
  addLog('info','版本/年级: '+version+' '+grade)

  try{
    const r=await fetch('/api/modules/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version,grade,modules})})
    const j=await r.json()
    if(j.error){alert(j.error);btn.disabled=false;btn.innerHTML='<span class="emoji">🔥</span> 解析清单并开始烹饪';return}
    addLog('success','✅ 已接单！开始烹饪 '+j.modules.length+' 道菜')
    $('serveWrap').style.display='none'
    // 轮询结果
    pollCookResult(modules)
  }catch(e){alert('启动失败: '+e.message);btn.disabled=false;btn.innerHTML='<span class="emoji">🔥</span> 解析清单并开始烹饪'}
  finally{setTimeout(()=>{btn.disabled=false;btn.innerHTML='<span class="emoji">🔥</span> 解析清单并开始烹饪'},4000)}
}

function pollCookResult(modules){
  let tried=0
  const timer=setInterval(async()=>{
    tried++
    try{
      const r=await(await fetch('/api/modules/result')).json()
      if(r.done&&r.results){
        clearInterval(timer)
        renderServe(r)
      }else if(tried>600){
        clearInterval(timer)
        addLog('warning','⏰ 烹饪超时（10分钟），请手动查看设备状态')
      }
    }catch(e){}
  },2000)
}

// ====== 上菜（结果展示） ======
function renderServe(data){
  const rs=data.results||{}
  const names=Object.keys(rs)
  const totalQ=names.reduce((s,n)=>s+(rs[n].q||0),0)
  const okN=names.filter(n=>rs[n].ok).length
  let html='<div class="serve-hdr">🍲 出餐完成！</div><div class="serve-cards">'
  names.forEach(n=>{
    const r=rs[n]; const ok=r.ok
    html+=`<div class="serve-card ${ok?'ok':'fail'}">
      <div class="sc-name">${n}</div>
      <div class="sc-stat"><span class="sc-q">${r.q||0}<small> 题</small></span></div>
      <div class="sc-detail">${ok?'✅ 完成':'❌ 失败'} · ${r.t||0}s${r.error?' · '+r.error:''}</div>
    </div>`
  })
  html+=`</div><div class="serve-summary">
    ${names.length} 道菜 · 成功 <b style="color:var(--green)">${okN}</b> 道 · 
    累计答题 <b style="color:var(--green)">${totalQ}</b> 题 · ${data.version||''} ${data.grade||''}
  </div>`
  const el=$('serveWrap')
  el.innerHTML=html
  el.style.display='block'
  el.scrollIntoView({behavior:'smooth'})
  addLog('success',`🍲 全部出餐！${names.length}道菜，${okN}道成功，${totalQ}题`)
}

// ====== 启动 ======
pollStatus()
pollLog()
refreshModuleSel()
</script>
</body>
</html>
