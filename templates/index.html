<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语宝模块检测 — 批量自动化审查</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f1f5f9;color:#1e293b;font-size:15px}

/* ====== 顶部导航 ====== */
.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;align-items:center;height:56px;gap:32px}
.nav .logo{font-size:18px;font-weight:700;color:#1e40af}
.nav a{color:#64748b;text-decoration:none;font-size:14px;padding:6px 14px;border-radius:6px}
.nav a:hover,.nav a.active{background:#eff6ff;color:#1e40af}

/* ====== 主布局 ====== */
.main{max-width:1400px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:900px){.main{grid-template-columns:1fr}}

/* ====== 卡片 ====== */
.card{background:#fff;border-radius:12px;border:1px solid #eef0f5;overflow:hidden}
.card-hdr{padding:16px 20px;background:#fafbfc;border-bottom:1px solid #f0f2f6;display:flex;align-items:center;gap:10px;font-weight:600}
.card-body{padding:20px}

/* ====== 表单 ====== */
.form-row{margin-bottom:14px}
.form-label{font-size:13px;font-weight:600;color:#64748b;margin-bottom:4px;display:block}
select,input[type=text],input[type=email]{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none}
select:focus,input:focus{border-color:#4a6cf7;box-shadow:0 0 0 3px rgba(74,108,247,.1)}
.form-hint{font-size:12px;color:#94a3b8;margin-top:2px;display:block}

/* ====== 按钮 ====== */
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:500;transition:all .2s}
.btn-primary{background:#4a6cf7;color:#fff}
.btn-primary:hover{background:#2952e8}
.btn-primary:disabled{background:#94a3b8;cursor:not-allowed}
.btn-danger{background:#ef4444;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-row{display:flex;gap:10px;margin-top:16px}

/* ====== 进度 ====== */
.progress-bar{background:#eef0f5;border-radius:6px;height:8px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4a6cf7,#6366f1);border-radius:6px;transition:width .3s}
.progress-stats{display:flex;gap:20px;font-size:13px;color:#64748b}
.progress-stats span{font-weight:600;color:#1e293b}

/* ====== 模块列表 ====== */
.module-list{max-height:300px;overflow-y:auto}
.module-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #f0f2f6;font-size:14px}
.module-item .idx{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.module-item .idx.pending{background:#f1f5f9;color:#64748b}
.module-item .idx.running{background:#dbeafe;color:#1e40af}
.module-item .idx.done{background:#dcfce7;color:#166534}
.module-item .idx.failed{background:#fee2e2;color:#991b1b}
.module-item .name{flex:1}
.module-item .stat{font-size:12px;color:#94a3b8}

/* ====== 日志 ====== */
.log-box{background:#0f172a;color:#94a3b8;font-family:"Consolas","Courier New",monospace;font-size:12px;padding:14px;border-radius:8px;max-height:300px;overflow-y:auto;line-height:1.7}
.log-box .level-success{color:#4ade80}
.log-box .level-warning{color:#fbbf24}
.log-box .level-error{color:#f87171}

/* ====== 标签 ====== */
.badge{font-size:12px;padding:2px 10px;border-radius:10px;font-weight:500}
.badge-running{background:#dbeafe;color:#1e40af}
.badge-idle{background:#f1f5f9;color:#64748b}

/* ====== 清单编辑 ====== */
.checklist-editor textarea{width:100%;height:120px;font-family:monospace;font-size:13px;border:1px solid #e2e8f0;border-radius:8px;padding:10px;resize:vertical}
</style>
</head>
<body>

<!-- ====== 导航 ====== -->
<div class="nav">
  <div class="logo">🔍 英语宝模块审查</div>
  <a href="/" class="active">📋 批量检查</a>
  <a href="/trace">🔎 错误溯源</a>
  <a href="/export">📤 报告导出</a>
  <span style="margin-left:auto;font-size:13px;color:#94a3b8">
    设备: <span id="devStatus" style="color:#94a3b8">检测中...</span>
  </span>
</div>

<!-- ====== 主内容 ====== -->
<div class="main">

  <!-- 左：自然语言 + 检查计划 + 进度 -->
  <div>
    <!-- 自然语言输入 -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-hdr">💬 一句话描述要检查什么</div>
      <div class="card-body">
        <textarea id="nlInput" placeholder='例如：帮我检测新湘鲁六年级上册的U6-U9听力专项模块基础巩固'
          style="width:100%;height:72px;border:1px solid #e2e8f0;border-radius:8px;padding:10px;font-size:14px;resize:vertical;font-family:inherit"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();parseNL()}"></textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
          <button class="btn btn-primary btn-sm" onclick="parseNL()">🔍 解析</button>
          <span id="nlResult" style="font-size:12px;color:#64748b"></span>
        </div>
      </div>
    </div>

    <!-- 检查计划 -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-hdr">📋 检查计划清单</div>
      <div class="card-body">
        <div class="form-row">
          <span class="form-label">教材版本</span>
          <select id="planVersion">
            <option selected>新湘鲁六上</option>
            <option>新湘鲁五上</option>
            <option>湘少版五上</option>
          </select>
        </div>

        <div class="form-row">
          <span class="form-label">Unit 范围</span>
          <div style="display:flex;gap:10px;align-items:center">
            <select id="planUnitFrom" style="flex:1">
              <option>6</option><option>7</option><option>8</option><option>9</option>
            </select>
            <span style="color:#94a3b8">至</span>
            <select id="planUnitTo" style="flex:1">
              <option>6</option><option>7</option><option selected>9</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <span class="form-label">阶段</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <label style="font-size:13px;cursor:pointer"><input type="checkbox" checked id="cbBase"> 基础巩固</label>
            <label style="font-size:13px;cursor:pointer"><input type="checkbox" id="cbAdv"> 综合进阶</label>
            <label style="font-size:13px;cursor:pointer"><input type="checkbox" id="cbHard"> 难点突破</label>
          </div>
        </div>

        <div class="form-row">
          <span class="form-label">对照脚本 <span style="font-weight:400;color:#ef4444;font-size:12px">* 需先在右侧上传</span></span>
          <select id="planDocx"></select>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btnStart" onclick="startBatch()">
            ▶ 开始批量检查
          </button>
          <button class="btn btn-danger btn-sm" id="btnCancel" onclick="cancelBatch()" style="display:none">
            ⏹ 停止
          </button>
          <button class="btn btn-sm" id="btnPause" onclick="togglePause()" style="display:none">
            ⏸ 暂停
          </button>
        </div>

        <div class="form-hint" id="planEta"></div>
      </div>
    </div>

    <!-- 进度 -->
    <div class="card" id="progressCard" style="display:none;margin-bottom:20px">
      <div class="card-hdr">
        ⏱ 执行进度
        <span class="badge badge-running" id="batchBadge" style="margin-left:auto">运行中</span>
      </div>
      <div class="card-body">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-stats">
          <span>完成: <b id="statDone">0</b>/<b id="statTotal">0</b> 模块</span>
          <span>通过: <b id="statPassed" style="color:#16a34a">0</b> 题</span>
          <span>错误: <b id="statFailed" style="color:#dc2626">0</b> 题</span>
          <span>剩余: <b id="statEta">--</b></span>
        </div>
        <div style="margin-top:10px;font-size:13px;color:#64748b">
          当前: <b id="currentModule">--</b>
        </div>
      </div>
    </div>

    <!-- 模块清单 -->
    <div class="card" id="moduleListCard" style="display:none">
      <div class="card-hdr">📝 模块状态</div>
      <div class="card-body" style="padding:0">
        <div class="module-list" id="moduleList"></div>
      </div>
    </div>
  </div>

  <!-- 右：日志 + 脚本上传 + 知识库 -->
  <div>
    <!-- 脚本上传 / 知识库 -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-hdr">📄 脚本 & 知识库</div>
      <div class="card-body">
        <div class="form-row">
          <span class="form-label">上传对照脚本 (.docx)</span>
          <input type="file" id="uploadInput" accept=".docx,.doc" onchange="uploadFile()">
          <div id="uploadList" style="margin-top:8px;font-size:13px;color:#94a3b8">暂无已上传文件</div>
        </div>
        <div class="form-row">
          <span class="form-label">无脚本时 <span style="color:#4a6cf7">🤖 AI 自动生成答案</span></span>
          <span class="form-hint">审查智能体会根据知识库自动推演正确答案</span>
        </div>
      </div>
    </div>

    <!-- 操作日志 -->
    <div class="card">
      <div class="card-hdr">📜 操作日志</div>
      <div class="card-body" style="padding:14px">
        <div class="log-box" id="logBox">
          <span style="color:#94a3b8">等待任务启动...</span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ====== 快捷选择器 ======
function $(id){return document.getElementById(id)}

// ====== 初始化 ======
async function init(){
  pollStatus()
  loadUploadList()
}
init()

// ====== 设备状态轮询 ======
async function pollStatus(){
  while(true){
    try{
      const s=await(await fetch('/api/status')).json()
      $('devStatus').textContent=s.device_connected?'已连接':'离线'
      $('devStatus').style.color=s.device_connected?'#16a34a':'#ef4444'

      // 批量状态
      const bs=await(await fetch('/api/batch/status')).json()
      updateBatchUI(bs)
    }catch(e){}
    await new Promise(r=>setTimeout(r,2000))
  }
}

// ====== 批量UI更新 (B实现) ======
function updateBatchUI(bs){
  if(!bs.running && !bs.paused){
    $('btnStart').style.display=''; $('btnCancel').style.display='none'; $('btnPause').style.display='none'
    $('progressCard').style.display='none'; $('moduleListCard').style.display='none'
    return
  }
  $('btnStart').style.display='none'; $('btnCancel').style.display=''; $('btnPause').style.display=''
  $('progressCard').style.display=''; $('moduleListCard').style.display=''

  const total=bs.completed.length+(bs.pending?.length||0)
  const done=bs.completed.length
  $('progressFill').style.width=(done/Math.max(total,1)*100)+'%'
  $('statDone').textContent=done; $('statTotal').textContent=total
  $('batchBadge').textContent=bs.paused?'已暂停':'运行中'
  $('batchBadge').className='badge '+(bs.paused?'badge-idle':'badge-running')
  $('statEta').textContent=bs.eta_remaining||'--'
  $('currentModule').textContent=bs.current?`U${bs.current.unit} ${bs.current.stage}`:'--'

  // 模块列表
  const items=[]
  bs.completed.forEach(m=>items.push({name:`U${m.unit} ${m.stage}`,status:'done',detail:`${m.questions||0}题`}))
  if(bs.current) items.push({name:`U${bs.current.unit} ${bs.current.stage}`,status:'running',detail:bs.current.question||''})
  bs.pending.forEach(m=>items.push({name:`U${m.unit} ${m.stage}`,status:'pending',detail:''}))
  bs.failed_modules.forEach(m=>items.push({name:`U${m.unit} ${m.stage}`,status:'failed',detail:m.reason||'失败'}))
  $('moduleList').innerHTML=items.map((m,i)=>
    `<div class="module-item">
      <div class="idx ${m.status}">${m.status==='done'?'✓':m.status==='running'?'▶':m.status==='failed'?'✗':i+1}</div>
      <div class="name">${m.name}</div>
      <div class="stat">${m.detail}</div>
    </div>`
  ).join('')

  // 统计
  let tp=0,tf=0
  bs.completed.forEach(m=>{tp+=m.passed||0;tf+=m.failed||0})
  $('statPassed').textContent=tp; $('statFailed').textContent=tf

  // 完成后显示
  if(!bs.running && done===total && total>0){
    $('progressFill').style.width='100%'
    $('btnStart').style.display=''; $('btnCancel').style.display='none'; $('btnPause').style.display='none'
    $('batchBadge').textContent='已完成'; $('batchBadge').className='badge badge-idle'
    addLog('success',`✅ 全部完成! ${tp}题通过, ${tf}题出错 → 查看 <a href="/trace" style="color:#4ade80">错误溯源</a>`)
  }
}

// ====== 文件上传 ======
async function uploadFile(){
  const f=$('uploadInput').files[0]; if(!f) return
  const fd=new FormData(); fd.append('file',f)
  await fetch('/api/upload',{method:'POST',body:fd})
  loadUploadList()
}

async function loadUploadList(){
  const d=await(await fetch('/api/upload/list')).json()
  $('planDocx').innerHTML=(d.files||[]).map(f=>`<option>${f.name}</option>`).join('')
  $('uploadList').innerHTML=(d.files||[]).length
    ? d.files.map(f=>`<div>📄 ${f.name} (${(f.size/1024).toFixed(0)}KB)</div>`).join('')
    : '<span>暂无上传 — 可跳过，AI将自动生成答案</span>'
}

// ====== 自然语言解析 ======
async function parseNL(){
  const text=$('nlInput').value.trim()
  if(!text){$('nlResult').textContent='请先输入描述';return}
  $('nlResult').textContent='⏳ 解析中...'
  try{
    const r=await(await fetch('/api/batch/parse',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    })).json()
    if(r.error){$('nlResult').textContent='❌ '+r.error;return}
    // 自动填入表单
    $('planVersion').value=r.version||'新湘鲁六上'
    $('planUnitFrom').value=r.units[0]
    $('planUnitTo').value=r.units[r.units.length-1]
    $('cbBase').checked=(r.stages||[]).includes('基础巩固')
    $('cbAdv').checked=(r.stages||[]).includes('综合进阶')
    $('cbHard').checked=(r.stages||[]).includes('难点突破')
    $('nlResult').textContent=`✅ 解析成功: ${r.version} U${r.units[0]}-${r.units[r.units.length-1]} [${(r.stages||[]).join('/')}] ${r.module_type}`
    $('planEta').textContent='⏱ '+(r.units.length*(r.stages||[]).length*6)+'分钟（预估）'
    // 自动开始跑
    setTimeout(()=>startBatch(),500)
  }catch(e){$('nlResult').textContent='解析失败: '+e}
}

// ====== 批量操作 ======
async function startBatch(){
  const from=parseInt($('planUnitFrom').value),to=parseInt($('planUnitTo').value)
  const units=[]; for(let u=from;u<=to;u++) units.push(u)
  const stages=[]
  if($('cbBase').checked) stages.push('基础巩固')
  if($('cbAdv').checked) stages.push('综合进阶')
  if($('cbHard').checked) stages.push('难点突破')
  if(!stages.length){alert('至少选一个阶段');return}

  const body={
    version:$('planVersion').value,
    units,stages,
    docx:$('planDocx').value||''
  }
  $('btnStart').disabled=true
  const r=await(await fetch('/api/batch/start',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  })).json()

  if(r.error){alert(r.error);$('btnStart').disabled=false;return}
  $('planEta').textContent='⏱ '+r.eta
  addLog('success',`✅ 批量任务已启动: ${r.modules} 个模块`)
  $('logBox').innerHTML=''
}

async function cancelBatch(){
  await fetch('/api/batch/cancel',{method:'POST'})
  addLog('warning','⏹ 任务已取消')
}

async function togglePause(){
  const bs=await(await fetch('/api/batch/status')).json()
  const ep=bs.paused?'resume':'pause'
  await fetch('/api/batch/'+ep,{method:'POST'})
  addLog('info',bs.paused?'▶ 继续':'⏸ 暂停')
}

// ====== 日志轮询 (B实现) ======
let logLast=0
async function pollLog(){
  const d=await(await fetch('/api/log')).json()
  const logs=(d.logs||[]).slice(logLast)
  if(logs.length) logLast+=logs.length
  logs.forEach(l=>addLog(l.level,l.msg))
  await new Promise(r=>setTimeout(r,1500))
}

function addLog(level,msg){
  const t=new Date().toLocaleTimeString()
  $('logBox').innerHTML+=`<div class="level-${level}">[${t}] ${msg}</div>`
  $('logBox').scrollTop=$('logBox').scrollHeight
}

// 启动日志轮询
setInterval(pollLog,2000)
</script>
</body>
</html>
