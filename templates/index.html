<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E英语宝模块检测</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f0f2f5; color:#333; font-size:14px; line-height:1.5 }
.header { background:#4a6cf7; color:white; padding:14px 20px; display:flex; align-items:center; gap:16px }
.header h1 { font-size:18px; font-weight:500 }
.header .sub { font-size:12px; opacity:0.85 }
.container { max-width:1280px; margin:0 auto; padding:14px; display:grid; grid-template-columns:300px 1fr 320px; gap:14px }
.card { background:white; border-radius:10px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.06) }
.card-title { font-size:13px; font-weight:500; color:#4a6cf7; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center }
.card-title .badge { background:#f0f2f5; color:#666; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:400 }

/* 状态点 */
.status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px }
.s-pending { background:#d1d5db }
.s-running { background:#f59e0b; animation:pulse 1s infinite }
.s-done { background:#22c55e }
.s-error { background:#ef4444 }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* 按钮 */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 14px; border:none; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; transition:all .2s }
.btn:disabled { opacity:.5; cursor:not-allowed }
.btn-primary { background:#4a6cf7; color:white }
.btn-primary:hover:not(:disabled) { background:#3b5de7 }
.btn-success { background:#22c55e; color:white }
.btn-warning { background:#f59e0b; color:white }
.btn-danger { background:#ef4444; color:white }
.btn-outline { background:transparent; border:1.5px solid #4a6cf7; color:#4a6cf7; padding:6px 12px }
.btn-outline:hover:not(:disabled) { background:#4a6cf7; color:white }
.btn-row { display:flex; gap:8px }
.btn-row .btn { flex:1 }

/* === 流程面板 === */
.flow-step { display:flex; align-items:flex-start; gap:10px; padding:8px 10px; margin-bottom:6px; border-radius:6px; transition:all .2s }
.flow-step .dot { flex-shrink:0; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; color:white; margin-top:2px }
.flow-step .body { flex:1; min-width:0 }
.flow-step .name { font-size:13px; font-weight:500; color:#333; margin-bottom:2px }
.flow-step .detail { font-size:11px; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.flow-step.pending { background:#f8fafc }
.flow-step.pending .dot { background:#d1d5db }
.flow-step.running { background:#fff7ed; border:1px solid #fed7aa }
.flow-step.running .dot { background:#f59e0b; box-shadow:0 0 0 4px rgba(245,158,11,.2); animation:pulse 1.5s infinite }
.flow-step.done { background:#f0fdf4 }
.flow-step.done .dot { background:#22c55e }
.flow-step.error { background:#fef2f2; border:1px solid #fecaca }
.flow-step.error .dot { background:#ef4444 }

/* === 题目结果卡 === */
.q-card { background:#fafbfc; border:1px solid #e5e7eb; border-radius:8px; padding:10px; margin-bottom:8px; transition:all .2s }
.q-card.pending { opacity:.6 }
.q-card.q-passed { border-left:3px solid #22c55e }
.q-card.q-failed { border-left:3px solid #ef4444 }
.q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px }
.q-header .left { display:flex; align-items:center; gap:10px }
.q-num { font-size:15px; font-weight:500; color:#4a6cf7 }
.q-type { font-size:11px; padding:1px 8px; border-radius:10px; background:#eef2ff; color:#4a6cf7 }
.q-score { font-size:13px; color:#22c55e; font-weight:500 }
.q-score.low { color:#f59e0b }
.q-score.bad { color:#ef4444 }
.q-ai-label { font-size:11px; padding:2px 8px; border-radius:10px; background:#f0f2f5; color:#888 }
.q-ai-label.pass { background:#dcfce7; color:#166534 }
.q-ai-label.fail { background:#fee2e2; color:#991b1b }
.q-pending-tag { font-size:11px; padding:2px 8px; border-radius:10px; background:#fef3c7; color:#92400e }
.dims { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:8px }
.dim { text-align:center; padding:6px 4px; background:white; border-radius:6px; border:1px solid #e5e7eb; font-size:11px }
.dim.pass { background:#dcfce7; color:#166534; border-color:#86efac }
.dim.fail { background:#fee2e2; color:#991b1b; border-color:#fca5a5 }
.dim.skip { background:#f3f4f6; color:#6b7280 }
.dim-icon { font-size:14px; margin-bottom:2px }
.dim-label { color:#666; font-size:10px }
.q-reasons { font-size:11px; color:#555; padding:6px 8px; background:#f8fafc; border-radius:4px; margin-bottom:8px; line-height:1.5; max-height:60px; overflow-y:auto }
.human-actions { display:flex; gap:6px; align-items:center }
.human-actions .note-input { flex:1; padding:4px 8px; border:1px solid #e5e7eb; border-radius:4px; font-size:11px }
.h-label-tag { font-size:10px; padding:1px 6px; border-radius:8px; background:#fef3c7; color:#92400e; margin-left:6px }

/* 选择器 */
.version-select, .text-input { width:100%; padding:8px 12px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:13px; background:white }

/* 文件上传 */
.upload-area { border:2px dashed #d1d5db; border-radius:8px; padding:14px; text-align:center; transition:all .2s; margin-bottom:8px }
.upload-area.dragover { border-color:#4a6cf7; background:#f0f5ff }
.upload-area .icon { font-size:28px; color:#4a6cf7; margin-bottom:4px }
.upload-area .txt { font-size:12px; color:#666; margin-bottom:6px }
.upload-area input[type=file] { display:none }

/* 设备 */
.device-info .row { display:flex; justify-content:space-between; padding:5px 0; font-size:12px; border-bottom:1px solid #f0f0f0 }
.device-info .row:last-child { border:none }
.device-info .key { color:#888 }
.device-info .value { font-weight:500 }

/* 日志 */
.log-container { height:160px; overflow-y:auto; font-size:11px; font-family:monospace; background:#1e293b; color:#e2e8f0; border-radius:6px; padding:8px }
.log-entry { padding:1px 0; display:flex; gap:6px }
.log-entry .time { color:#64748b; flex-shrink:0 }
.log-entry .level { flex-shrink:0; font-weight:500 }
.log-entry .level.info { color:#60a5fa }
.log-entry .level.success { color:#4ade80 }
.log-entry .level.error { color:#f87171 }
.log-entry .level.warning { color:#fbbf24 }

/* 截图 */
.screenshot-area { background:#f8fafc; border-radius:6px; overflow:hidden; text-align:center; min-height:80px; display:flex; align-items:center; justify-content:center }
.screenshot-area img { max-width:100%; max-height:240px }
.screenshot-area .placeholder { color:#94a3b8; font-size:12px; padding:14px }

@media (max-width:900px) { .container { grid-template-columns:1fr } }
</style>
</head>
<body>

<div class="header">
  <h1>E英语宝模块检测</h1>
  <span class="sub" id="deviceBadge">设备: —</span>
  <span class="sub" id="runBadge" style="margin-left:auto">空闲</span>
</div>

<div class="container">

  <!-- 左栏: 流程可视化 -->
  <div>
    <div class="card">
      <div class="card-title">
        <span>设备状态</span>
      </div>
      <div class="device-info" id="deviceInfo">
        <div class="row"><span class="key">状态</span><span class="value" id="statusText"><span class="status-dot s-pending"></span>检测中</span></div>
        <div class="row"><span class="key">型号</span><span class="value" id="modelText">—</span></div>
        <div class="row"><span class="key">序列号</span><span class="value" id="serialText">—</span></div>
        <div class="row"><span class="key">APP版本</span><span class="value" id="currentVersionText">—</span></div>
      </div>
    </div>

    <!-- ===== 流程可视化面板 ===== -->
    <div class="card">
      <div class="card-title">
        <span>检查流程</span>
        <span class="badge" id="flowProgress">0/8</span>
      </div>
      <div id="workflowList">
        <!-- JS动态填充8个步骤 -->
      </div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0">
        <div style="font-size:12px;color:#888;margin-bottom:6px">运行参数</div>
        <select class="version-select" id="inspectVersion">
          <option value="新湘鲁五上">新湘鲁五上</option>
          <option value="新湘鲁五下">新湘鲁五下</option>
          <option value="新湘鲁六上" selected>新湘鲁六上</option>
          <option value="新湘鲁六下">新湘鲁六下</option>
        </select>
        <div style="display:flex;gap:6px;margin-top:6px">
          <select class="version-select" id="inspectUnit" style="flex:1">
            <option>6</option><option>7</option><option>8</option><option>9</option>
          </select>
          <select class="version-select" id="inspectStage" style="flex:2">
            <option selected>基础巩固</option><option>综合进阶</option><option>难点突破</option>
          </select>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn btn-primary" id="runBtn" onclick="startListeningInspect()">▶ 开始检查</button>
          <button class="btn btn-danger" onclick="stopInspect()">⏹ 停止</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">实时日志 <span class="badge" id="logCount">0</span></div>
      <div class="log-container" id="logContainer">
        <div class="log-entry"><span class="time">--:--:--</span><span class="level info">等待开始</span></div>
      </div>
    </div>
  </div>

  <!-- 中栏: 题目检查结果 -->
  <div>
    <div class="card">
      <div class="card-title">
        <span>题目检查结果</span>
        <span class="badge" id="qStats">待运行</span>
      </div>
      <div id="questionList" style="max-height:680px;overflow-y:auto">
        <div style="text-align:center;color:#94a3b8;padding:30px 0;font-size:13px">
          尚未开始检查<br><span style="font-size:11px">点击左上角"▶ 开始检查"</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 右栏: 审查智能体 + 截图 -->
  <div>
    <div class="card">
      <div class="card-title">脚本上传</div>
      <div class="upload-area" id="dropZone">
        <div class="icon">+</div>
        <div class="txt">上传 DOCX → 自动入知识库</div>
        <input type="file" id="fileInput" accept=".docx">
        <button class="btn btn-outline" style="padding:4px 10px;font-size:12px;width:auto" onclick="document.getElementById('fileInput').click()">选择文件</button>
      </div>
      <div id="uploadStatus" style="font-size:11px;color:#888"></div>
      <div id="uploadedFiles" style="font-size:11px;max-height:80px;overflow-y:auto;margin-top:4px"></div>
    </div>

    <div class="card">
      <div class="card-title">知识库 <span class="badge" id="kbCount">0条</span></div>
      <div id="kbStatus" style="font-size:11px;color:#888">加载中</div>
    </div>

    <div class="card">
      <div class="card-title">审查智能体</div>
      <select class="version-select" id="reviewDocx" style="margin-bottom:6px"></select>
      <div style="display:flex;gap:6px">
        <input type="number" id="reviewUnit" class="text-input" value="0" placeholder="Unit (0=全部)" style="flex:1">
        <button class="btn btn-primary" onclick="runReview()">审查</button>
      </div>
      <div id="reviewResult" style="margin-top:8px;font-size:11px;color:#888"></div>
    </div>

    <div class="card">
      <div class="card-title">智能体学习状态</div>
      <div id="agentStatus" style="font-size:11px;color:#555;line-height:1.7">
        <div>反馈样本: <b id="fbTotal">0</b></div>
        <div>AI准确率: <b id="fbAccuracy">-</b></div>
        <div>已标注: <b id="fbLabeled">0</b></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">截图预览</div>
      <div class="screenshot-area" id="screenshotArea">
        <div class="placeholder">执行操作后显示</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// 全局
// ============================================================
let POLLING = false;
let INSPECT_RUNNING = false;
let POLL_TIMER = null;

function $(id) { return document.getElementById(id) }

// ============================================================
// 流程步骤 (8步对应图片模板)
// ============================================================
const WORKFLOW_STEPS = [
  {key:'0.回到首页',    name:'0. 回到首页'},
  {key:'1.启动APP',    name:'1. 启动APP'},
  {key:'1.5关闭教程',  name:'1.5 关闭教程'},
  {key:'2.关闭广告',    name:'2. 关闭广告'},
  {key:'3.英语Tab',    name:'3. 英语Tab'},
  {key:'3.5版本检查',  name:'3.5 版本检查'},
  {key:'4.专项突破',    name:'4. 进入专项突破'},
  {key:'5.听力专项',    name:'5. 进入听力专项'},
  {key:'6.逐题巡检',    name:'6. 逐题巡检'},
  {key:'7.生成报告',    name:'7. 生成报告'},
];

function renderWorkflow() {
  const el = $('workflowList');
  el.innerHTML = WORKFLOW_STEPS.map((s, i) => `
    <div class="flow-step pending" id="step_${i}">
      <div class="dot">${i+1}</div>
      <div class="body">
        <div class="name">${s.name}</div>
        <div class="detail" id="step_${i}_detail">等待</div>
      </div>
    </div>
  `).join('');
}

function updateStep(idx, status, detail='') {
  const step = $('step_' + idx);
  if (!step) return;
  step.className = 'flow-step ' + status;
  const det = $('step_' + idx + '_detail');
  if (det) det.textContent = detail || (status === 'running' ? '进行中' : status === 'done' ? '完成' : status === 'error' ? '错误' : '等待');
}

// ============================================================
// 状态轮询
// ============================================================
async function pollState() {
  if (POLLING) return;
  POLLING = true;
  while (true) {
    try {
      // 设备状态
      const sres = await fetch('/api/status');
      const sd = await sres.json();
      updateDevice(sd);
      INSPECT_RUNNING = sd.task_status.running;
      $('runBadge').textContent = INSPECT_RUNNING ? '🔴 运行中' : '空闲';
      $('runBadge').style.color = INSPECT_RUNNING ? '#f87171' : '#4ade80';

      // 检查流程状态
      const fres = await fetch('/api/inspect/state');
      const fd = await fres.json();
      updateFlow(fd);
      updateQuestions(fd);
      updateScreenshot(fd);

      // 日志
      pollLog();
    } catch(e) { console.warn(e) }
    await sleep(1500);
  }
}

function updateDevice(d) {
  const dot = $('statusText').querySelector('.status-dot');
  dot.className = 'status-dot ' + (d.device_connected ? 's-done' : 's-error');
  $('statusText').innerHTML = '';
  $('statusText').appendChild(dot);
  $('statusText').appendChild(document.createTextNode(d.device_connected ? ' 在线' : ' 离线'));
  $('serialText').textContent = d.device_serial || '—';
  $('deviceBadge').textContent = '设备: ' + (d.device_connected ? '✅ 已连接' : '❌ 未连接');
  if (d.current_version) $('currentVersionText').textContent = d.current_version;
}

function updateFlow(fd) {
  const steps = fd.workflow_steps || [];
  let done = 0;
  steps.forEach((s, i) => {
    const idx = WORKFLOW_STEPS.findIndex(w => w.key === s.step);
    if (idx >= 0) {
      updateStep(idx, s.status, s.detail || '');
      if (s.status === 'done') done++;
    }
  });
  $('flowProgress').textContent = `${done}/${WORKFLOW_STEPS.length}`;
}

function updateQuestions(fd) {
  const questions = fd.questions || {};
  const ids = Object.keys(questions).sort();
  const total = ids.length;
  const labeled = Object.values(questions).filter(q => q.human_label).length;
  const passed = Object.values(questions).filter(q => q.human_label === '通过').length;
  const failed = Object.values(questions).filter(q => q.human_label === '不通过').length;

  $('qStats').textContent = total ? `${total}题 · ${passed}通过 · ${failed}不通过` : '待运行';
  $('fbTotal').textContent = total;
  $('fbLabeled').textContent = labeled;

  if (!total) return;
  const el = $('questionList');
  el.innerHTML = ids.map(qid => {
    const q = questions[qid];
    const passed = q.overall_passed;
    return `
      <div class="q-card ${passed ? 'q-passed' : 'q-failed'}" id="qc_${qid}">
        <div class="q-header">
          <div class="left">
            <span class="q-num">Q${String(q.idx).padStart(2,'0')}</span>
            <span class="q-type">${q.question_type || '?'}</span>
            <span class="q-ai-label ${passed ? 'pass' : 'fail'}">AI: ${passed ? '通过' : '不通过'}</span>
            ${q.human_label ? `<span class="q-ai-label ${q.human_label === '通过' ? 'pass' : 'fail'}">人: ${q.human_label}</span>` : ''}
          </div>
          <div>
            <span class="q-score ${q.overall_score >= 0.8 ? '' : (q.overall_score >= 0.5 ? 'low' : 'bad')}">${q.overall_score}</span>
          </div>
        </div>
        <div class="dims">
          <div class="dim ${q.ai_stem ? 'pass' : 'fail'}">
            <div class="dim-icon">${q.ai_stem ? '✅' : '❌'}</div>
            <div>题干</div>
          </div>
          <div class="dim ${q.ai_content ? 'pass' : 'fail'}">
            <div class="dim-icon">${q.ai_content ? '✅' : '❌'}</div>
            <div>内容</div>
          </div>
          <div class="dim ${q.ai_image ? 'pass' : (q.question_type && q.question_type.includes('图片') ? 'fail' : 'skip')}">
            <div class="dim-icon">${q.ai_image ? '✅' : (q.question_type && q.question_type.includes('图片') ? '❌' : '⏭')}</div>
            <div>配图</div>
          </div>
          <div class="dim ${q.ai_answer ? 'pass' : 'fail'}">
            <div class="dim-icon">${q.ai_answer ? '✅' : '❌'}</div>
            <div>作答</div>
          </div>
        </div>
        <div class="q-reasons">
          <b>(1)题干:</b> ${q.stem_reason || '-'}<br>
          <b>(2)内容:</b> ${q.content_reason || '-'}<br>
          <b>(3)配图:</b> ${q.image_reason || '-'}<br>
          <b>(4)作答:</b> ${q.answer_reason || '-'}
        </div>
        <div class="human-actions">
          ${q.human_label ? `<span class="h-label-tag">已标注: ${q.human_label} ${q.human_note || ''}</span>` : `
            <input type="text" class="note-input" id="note_${qid}" placeholder="人工备注(可选)">
            <button class="btn btn-success" style="padding:4px 8px;font-size:11px" onclick="humanLabel('${qid}', '通过')">✓ 通过</button>
            <button class="btn btn-danger" style="padding:4px 8px;font-size:11px" onclick="humanLabel('${qid}', '不通过')">✗ 不通过</button>
          `}
        </div>
      </div>
    `;
  }).join('');
}

function updateScreenshot(fd) {
  const questions = fd.questions || {};
  const ids = Object.keys(questions).sort();
  if (!ids.length) return;
  const latest = ids[ids.length - 1];
  const q = questions[latest];
  if (q.screenshot) {
    const area = $('screenshotArea');
    area.innerHTML = `<img src="/api/screenshot/${q.screenshot}" onerror="this.parentElement.innerHTML='<div class=placeholder>${latest}</div>'">`;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)) }

// ============================================================
// 日志
// ============================================================
let lastLogCount = 0;
async function pollLog() {
  try {
    const res = await fetch('/api/log');
    const log = await res.json();
    $('logCount').textContent = log.length;
    if (log.length > lastLogCount) {
      const container = $('logContainer');
      for (let i = lastLogCount; i < log.length; i++) {
        const entry = log[i];
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerHTML = `<span class="time">${entry.time}</span><span class="level ${entry.level}">${entry.level.toUpperCase()}</span><span>${entry.msg}</span>`;
        container.appendChild(div);
      }
      container.scrollTop = container.scrollHeight;
      lastLogCount = log.length;
    }
  } catch(e) {}
}

function addLog(level, msg) {
  const container = $('logContainer');
  const now = new Date().toTimeString().slice(0,8);
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<span class="time">${now}</span><span class="level ${level}">${level.toUpperCase()}</span><span>${msg}</span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ============================================================
// 操作
// ============================================================
async function startListeningInspect() {
  const version = $('inspectVersion').value;
  const unit = $('inspectUnit').value;
  const stage = $('inspectStage').value;
  const sel = $('reviewDocx');
  const docx = sel ? sel.value : '';

  $('runBtn').disabled = true;
  addLog('info', `🚀 启动: ${version} U${unit} ${stage}`);

  try {
    const res = await fetch('/api/inspect/listening-run', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({version, unit: parseInt(unit), stage, docx})
    });
    const data = await res.json();
    if (data.error) { alert(data.error); $('runBtn').disabled = false; return }
    addLog('success', `任务已启动: ${data.task || data.status}`);
    INSPECT_RUNNING = true;
    // 重置流程步骤显示
    WORKFLOW_STEPS.forEach((s, i) => updateStep(i, 'pending', ''));
  } catch(e) { alert('启动失败: ' + e); $('runBtn').disabled = false; }
}

async function stopInspect() {
  try {
    await fetch('/api/inspect/stop', {method: 'POST'});
    addLog('warning', '⏹ 停止信号已发送');
  } catch(e) {}
}

async function humanLabel(qid, label) {
  const noteEl = $('note_' + qid);
  const note = noteEl ? noteEl.value : '';
  try {
    const res = await fetch('/api/inspect/human-label', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({qid, label, note})
    });
    const data = await res.json();
    if (data.success) {
      addLog(label === '通过' ? 'success' : 'warning', `Q${qid} 标注: ${label}`);
      // 触发一次轮询以更新UI
      const fres = await fetch('/api/inspect/state');
      const fd = await fres.json();
      updateQuestions(fd);
      updateAgentStatus();
    }
  } catch(e) { addLog('error', '标注失败: ' + e) }
}

async function runReview() {
  const sel = $('reviewDocx');
  const docx = sel ? sel.value : '';
  const unit = parseInt($('reviewUnit')?.value || '0');
  $('reviewResult').innerHTML = '⏳ 审查中, 每张约5-30秒...';
  try {
    const res = await fetch('/api/review/run', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({docx, unit, stage: '基础巩固'})
    });
    const data = await res.json();
    if (data.error) { $('reviewResult').innerHTML = `<span style="color:red">❌ ${data.error}</span>`; return; }
    $('reviewResult').innerHTML = `✅ 完成: ${data.total}题, 通过${data.passed} (${data.avg_score})`;
  } catch(e) { $('reviewResult').innerHTML = `<span style="color:red">❌ ${e}</span>`; }
}

// ============================================================
// 上传 + 知识库
// ============================================================
async function uploadFile(file) {
  const form = new FormData();
  form.append('file', file);
  $('uploadStatus').textContent = `上传中: ${file.name}`;
  $('uploadStatus').style.color = '#888';
  try {
    const res = await fetch('/api/upload-docx', {method:'POST', body: form});
    const data = await res.json();
    if (data.error) { $('uploadStatus').textContent = `❌ ${data.error}`; $('uploadStatus').style.color = 'red'; return; }
    $('uploadStatus').innerHTML = `✅ ${data.message}`;
    $('uploadStatus').style.color = 'green';
    loadUploadedFiles();
    loadKBStatus();
    loadAgentStatus();
  } catch(e) { $('uploadStatus').textContent = `❌ ${e}`; }
}

$('fileInput').addEventListener('change', e => uploadFile(e.target.files[0]));

const dropZone = $('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', e => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});

async function loadUploadedFiles() {
  const res = await fetch('/api/upload/list');
  const data = await res.json();
  const sel = $('reviewDocx');
  if (data.files && data.files.length) {
    $('uploadedFiles').innerHTML = data.files.map(f => `<div>📄 ${f.name}</div>`).join('');
    sel.innerHTML = data.files.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
  } else {
    $('uploadedFiles').innerHTML = '<div style="color:#888">暂无文件</div>';
  }
}

async function loadKBStatus() {
  try {
    const res = await fetch('/api/knowledge/status');
    const d = await res.json();
    if (d.total_entries > 0) {
      $('kbCount').textContent = `${d.total_entries}条`;
      $('kbStatus').innerHTML = `✅ ${d.total_entries}条<br><span style="color:#888">${d.grades.join(', ')}</span>`;
    } else {
      $('kbStatus').innerHTML = '⚠ 空, 请上传';
    }
  } catch(e) {}
}

async function loadAgentStatus() {
  try {
    const res = await fetch('/api/review/results');
    // 顺便获取反馈统计
    // (简化处理, 直接从已记录的标注统计)
    const state = await fetch('/api/inspect/state').then(r=>r.json());
    const questions = state.questions || {};
    const total = Object.keys(questions).length;
    const labeled = Object.values(questions).filter(q => q.human_label).length;
    const correct = Object.values(questions).filter(q => q.human_label === '通过' && q.overall_passed).length
                  + Object.values(questions).filter(q => q.human_label === '不通过' && !q.overall_passed).length;
    $('fbTotal').textContent = total;
    $('fbLabeled').textContent = labeled;
    $('fbAccuracy').textContent = labeled > 0 ? `${(correct/labeled*100).toFixed(0)}%` : '-';
  } catch(e) {}
}

// ============================================================
// 初始化
// ============================================================
renderWorkflow();
loadUploadedFiles();
loadKBStatus();
pollState();  // 持续轮询所有状态
</script>
</body>
</html>
