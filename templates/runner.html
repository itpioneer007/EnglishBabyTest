<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遍历控制台 · 英语宝模块检测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:14px;height:100vh;overflow:hidden}

/* ===== 三栏布局 ===== */
.app{display:grid;grid-template-columns:380px 1fr;grid-template-rows:1fr 1fr;height:100vh;gap:10px;padding:10px}
.left-top{grid-row:1;grid-column:1;background:#fff;border-radius:10px;border:1px solid #e6e8ec;display:flex;flex-direction:column;overflow:hidden}
.left-bot{grid-row:2;grid-column:1;background:#fff;border-radius:10px;border:1px solid #e6e8ec;display:flex;flex-direction:column;overflow:hidden}
.right{grid-row:1/3;grid-column:2;background:#fff;border-radius:10px;border:1px solid #e6e8ec;display:flex;flex-direction:column;overflow:hidden}

/* ===== 区域标题 ===== */
.section-hdr{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f2f5;gap:8px}
.section-hdr .icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px}
.section-hdr .icon.plan{background:#f0f2f5;color:#666}
.section-hdr .icon.list{background:#f0f2f5;color:#666}
.section-hdr .icon.log{background:#f0f2f5;color:#666}
.section-hdr .title{font-size:13px;font-weight:600;color:#333}
.section-hdr .badge{font-size:11px;padding:2px 8px;border-radius:4px;margin-left:auto}
.badge-idle{background:#f0f2f5;color:#999}
.badge-run{background:#e0e7ff;color:#1a1a2e}
.badge-done{background:#d1fae5;color:#065f46}
.badge-fail{background:#fee2e2;color:#991b1b}

/* ===== 输入区 ===== */
.input-area{flex:1;padding:14px 16px;display:flex;flex-direction:column}
.input-area textarea{flex:1;width:100%;background:#f8f9fb;border:1px solid #e6e8ec;border-radius:8px;padding:12px;font-size:13px;color:#1a1a2e;resize:none;outline:none;font-family:inherit;min-height:90px;line-height:1.6}
.input-area textarea:focus{border-color:#1a1a2e;background:#fff}
.input-area .hint{font-size:11px;color:#999;margin-top:6px}
.input-area .actions{display:flex;align-items:center;gap:10px;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s}
.btn-primary{background:#1a1a2e;color:#fff}
.btn-primary:hover{background:#333}
.btn-primary:disabled{background:#d1d5db;cursor:not-allowed}
.btn-stop{background:#dc2626;color:#fff}
.btn-stop:hover{background:#b91c1c}
.btn-stop:disabled{background:#fca5a5;cursor:not-allowed}
.parsed-result{font-size:11px;color:#059669;background:#ecfdf5;padding:5px 10px;border-radius:4px;display:none}
.parsed-result.show{display:block}

/* ===== 模块列表 ===== */
.module-list{flex:1;overflow-y:auto;padding:6px 10px}
.module-item{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:2px 0;border-radius:6px;font-size:13px;transition:all .15s}
.module-item.wait{color:#999}
.module-item.run{background:#f0f2f5;color:#1a1a2e;border-left:3px solid #1a1a2e}
.module-item.ok{color:#065f46}
.module-item.fail{background:#fef2f2;color:#991b1b}
.module-item .icon-box{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.module-item .icon-box.wait{background:#f0f2f5;color:#999}
.module-item .icon-box.run{background:#1a1a2e;color:#fff}
.module-item .icon-box.ok{background:#d1fae5;color:#065f46}
.module-item .icon-box.fail{background:#fee2e2;color:#991b1b}
.module-item .info{flex:1}
.module-item .info .name{font-weight:500}
.module-item .info .meta{font-size:11px;color:#999;margin-top:1px}
.module-item .dur{font-size:11px;color:#666;white-space:nowrap}

/* ===== 状态栏 ===== */
.status-bar{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 14px;background:#f8f9fb;border-bottom:1px solid #f0f2f5}
.stat-item{text-align:center}
.stat-item .num{font-size:18px;font-weight:700;color:#1a1a2e}
.stat-item .num.pass{color:#059669}
.stat-item .num.fail{color:#dc2626}
.stat-item .lbl{font-size:11px;color:#999;margin-top:1px}

/* ===== 日志 ===== */
.log-box{flex:1;overflow-y:auto;padding:10px 14px;font-family:"SF Mono","Menlo","Consolas",monospace;font-size:12px;line-height:1.7;background:#fafbfc;border-radius:6px;margin:0 14px 14px 14px}
.log-line{padding:1px 0}
.log-line .t{color:#bbb;margin-right:8px}
.log-line.s .msg{color:#059669}
.log-line.i .msg{color:#666}
.log-line.w .msg{color:#d97706}
.log-line.e .msg{color:#dc2626}
.log-line.em .msg{color:#1a1a2e;font-weight:600}

/* ===== 错误面板 ===== */
.error-panel{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px 12px;margin:0 14px 10px;display:none}
.error-panel.show{display:block}
.error-panel .title{font-size:12px;font-weight:600;color:#991b1b;margin-bottom:4px}
.error-panel .body{font-size:11px;color:#7f1d1d;line-height:1.5}

/* 滚动条 */
.module-list::-webkit-scrollbar,.log-box::-webkit-scrollbar{width:4px}
.module-list::-webkit-scrollbar-thumb,.log-box::-webkit-scrollbar-thumb{background:#e6e8ec;border-radius:2px}

/* ===== 连接提示 ===== */
.conn-hint{font-size:11px;display:flex;align-items:center;gap:4px;margin-left:auto;color:#999}
.conn-hint .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.conn-hint .dot.on{background:#059669}
.conn-hint .dot.off{background:#dc2626}
</style>
</head>
<body>

<div class="app">

  <!-- ===== 左上方：计划输入 ===== -->
  <div class="left-top">
    <div class="section-hdr">
      <div class="icon plan">📋</div>
      <div class="title">检查计划</div>
      <span style="font-size:11px;color:#999;margin-left:auto">粘贴一句话 → 自动执行</span>
    </div>
    <div class="input-area">
      <textarea id="nlInput" placeholder='例如：&#10;  新湘鲁六年级上册 U6-U9 听力专项 基础巩固&#10;  湘少五上 6到9单元 知识过关 综合进阶&#10;跑完一个模块自动进入下一个，失败自动跳过继续'></textarea>
      <div class="hint">
        <span id="nlHint">支持格式：教材版本 + 单元范围 + 模块 + 阶段，可省略默认</span>
      </div>
      <div class="actions">
        <span id="btnRunWrap">
          <button class="btn btn-primary" id="btnRun" onclick="startRun()">▶ 开始执行</button>
        </span>
        <button class="btn btn-stop" id="btnStop" onclick="stopRun()" disabled>■ 停止</button>
        <div class="parsed-result" id="parsedResult"></div>
      </div>
    </div>
  </div>

  <!-- ===== 左下方：模块执行状态 ===== -->
  <div class="left-bot">
    <div class="section-hdr">
      <div class="icon list">☰</div>
      <div class="title">执行进度</div>
      <span class="badge badge-idle" id="stateBadge">就绪</span>
      <span class="conn-hint" id="connHint"><span class="dot off"></span> 离线</span>
    </div>

    <!-- 状态摘要 -->
    <div class="status-bar">
      <div class="stat-item"><div class="num" id="scDone">0</div><div class="lbl">已完成</div></div>
      <div class="stat-item"><div class="num" id="scTotal">0</div><div class="lbl">共需执行</div></div>
      <div class="stat-item"><div class="num" id="scOk">0</div><div class="lbl">通过</div></div>
      <div class="stat-item"><div class="num fail" id="scFail">0</div><div class="lbl">失败</div></div>
    </div>

    <!-- 模块列表 -->
    <div class="module-list" id="moduleList">
      <div style="text-align:center;padding:20px;color:#ccc;font-size:12px">启动任务后显示模块执行顺序</div>
    </div>

    <!-- 错误面板 -->
    <div class="error-panel" id="errorPanel">
      <div class="title">⛔ 模块执行出错</div>
      <div class="body" id="errorBody"></div>
    </div>
  </div>

  <!-- ===== 右方：操作日志 ===== -->
  <div class="right">
    <div class="section-hdr">
      <div class="icon log">📄</div>
      <div class="title">操作日志</div>
      <span style="font-size:11px;color:#999;margin-left-auto">记录每一步导航和点击</span>
      <span id="elapsedDisplay" style="font-size:11px;color:#666;margin-left:auto;font-weight:500"></span>
    </div>
    <div class="log-box" id="logBox">
      <div class="log-line i"><span class="msg">等待任务...</span></div>
    </div>
  </div>

</div>

<script>
// ====== 工具 ======
const $ = id => document.getElementById(id)

function log(level, msg){
  const map = {s:'success', i:'info', w:'warning', e:'error', em:'em'}
  const lvl = map[level]||'i'
  const t = new Date().toLocaleTimeString('zh-CN',{hour12:false})
  const box = $('logBox')
  box.innerHTML += `<div class="log-line ${lvl}"><span class="t">${t}</span><span class="msg">${msg}</span></div>`
  box.scrollTop = box.scrollHeight
}

// ====== 计时 ======
let timer = null, startTime = null
function startTimer(){
  startTime = Date.now()
  if(timer) clearInterval(timer)
  timer = setInterval(() => {
    const s = Math.floor((Date.now()-startTime)/1000)
    $('elapsedDisplay').textContent = s<60 ? s+'s' : Math.floor(s/60)+'m'+s%60+'s'
  }, 500)
}
function stopTimer(){
  if(timer){clearInterval(timer); timer=null}
}

// ====== 解析提示（输入时自动） ======
$('nlInput').addEventListener('input', debounce(async function(){
  const t = this.value.trim()
  const hint = $('nlHint')
  const parsed = $('parsedResult')
  if(t.length < 6){
    hint.textContent = '支持格式：教材版本 + 单元范围 + 模块 + 阶段，可省略默认'
    hint.style.color = '#999'
    parsed.classList.remove('show')
    return
  }
  try {
    const r = await(await fetch('/api/batch/parse',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t})
    })).json()
    if(r && r.version){
      const units = r.units.length>1 ? `${r.units[0]}-${r.units[r.units.length-1]}` : `U${r.units[0]}`
      parsed.innerHTML = `版本: ${r.version} · ${units} · ${r.module_type||''} · ${(r.stages||[]).join('/')} — ${(r.units||[]).length * (r.stages||[]).length} 个模块`
      parsed.classList.add('show')
    }
  } catch(e){}
}, 400))

function debounce(fn, ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)}}

// ====== 启动/停止 ======
async function startRun(){
  const text = $('nlInput').value.trim()
  if(!text){$('nlHint').textContent='请输入检查描述';$('nlHint').style.color='#dc2626';return}

  $('btnRun').disabled = true; $('btnStop').disabled = false
  $('stateBadge').textContent = '运行中'; $('stateBadge').className = 'badge badge-run'
  $('scDone').textContent = '0'
  $('moduleList').innerHTML = '<div style="text-align:center;padding:20px;color:#ccc;font-size:12px">正在启动...</div>'
  $('logBox').innerHTML = ''
  $('errorPanel').classList.remove('show')
  log('i', '▶ 解析描述 → 生成任务队列')
  startTimer()

  try {
    const r = await(await fetch('/api/batch/dry-run',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    })).json()
    if(r.error) throw new Error(r.error)
    log('s', `✅ 任务已下发: ${r.modules} 个模块, ${r.eta}`)
    pollStatus()
  } catch(e) {
    log('e', `❌ 启动失败: ${e.message}`)
    $('stateBadge').textContent = '失败'; $('stateBadge').className = 'badge badge-fail'
    $('btnRun').disabled = false; $('btnStop').disabled = true
    $('errorPanel').classList.add('show')
    $('errorBody').textContent = e.message
    stopTimer()
  }
}

async function stopRun(){
  await fetch('/api/batch/cancel',{method:'POST'})
  log('w', '⏹ 用户手动停止')
  finishRun()
}

// ====== 轮询 ======
let pollId = null

function pollStatus(){
  if(pollId) clearInterval(pollId)
  pollId = setInterval(async () => {
    try {
      const s = await(await fetch('/api/batch/status')).json()
      render(s)
      if(!s.running && !s.paused) finishRun()
    } catch(e){}
  }, 1200)
}

function render(s){
  const done = s.completed?.length||0
  const fail = s.failed_modules?.length||0
  const pend = s.pending?.length||0
  const total = done+fail+pend

  $('scDone').textContent = done+fail
  $('scTotal').textContent = total
  $('scOk').textContent = done
  $('scFail').textContent = fail

  // 模块列表
  const items = []
  s.completed?.forEach(m => items.push({state:'ok', name:`U${m.unit} ${m.stage}`, meta:`${m.questions||'?'} 题`, dur:m.duration||'完成'}))
  if(s.current) items.push({state:'run', name:`U${s.current.unit} ${s.current.stage}`, meta:'执行中', dur:'⏳'})
  s.pending?.forEach(m => items.push({state:'wait', name:`U${m.unit} ${m.stage}`, meta:'等待', dur:''}))
  s.failed_modules?.forEach(m => items.push({state:'fail', name:`U${m.unit} ${m.stage}`, meta:(m.error||m.reason||'失败').slice(0,25), dur:'×'}))

  $('moduleList').innerHTML = items.map(m => `
    <div class="module-item ${m.state}">
      <div class="icon-box ${m.state}">${m.state==='ok'?'✓':m.state==='run'?'▶':m.state==='fail'?'!':'◦'}</div>
      <div class="info"><div class="name">${m.name}</div><div class="meta">${m.meta}</div></div>
      <div class="dur">${m.dur}</div>
    </div>
  `).join('')
}

function finishRun(){
  stopTimer()
  $('btnRun').disabled = false; $('btnStop').disabled = true
  $('stateBadge').textContent = '执行完毕'; $('stateBadge').className = 'badge badge-done'
  if(pollId){clearInterval(pollId); pollId=null}
}

// ====== 设备状态 ======
setInterval(async () => {
  try {
    const s = await(await fetch('/api/status')).json()
    const dot = $('connHint').querySelector('.dot')
    dot.className = s.device_connected ? 'dot on' : 'dot off'
    $('connHint').childNodes[1].textContent = s.device_connected ? '已连接' : '离线'
  } catch(e){}
}, 3000)
</script>
</body>
</html>
