# 英语宝模块检测 - 全局配置
# 修改此文件即可配置设备、账号、输出路径等
#
# ⚠ 本文件会随代码一起提交到仓库，请勿写入任何只在某一台电脑上成立的内容：
#   设备串号、绝对路径（如 D:\压缩包存储\...）、个人密钥。
#   需要按人/按机器区分的内容，请放在 .env（不入库）里，或用环境变量覆盖。

# 设备配置
device:
  # 留空 = 自动使用当前在线设备（真机优先）。
  # 需要固定某台时再填串号（adb devices 查看）。
  # ⚠ 不要在这里写死别人的串号：换一台电脑/换一台手机时，adb 会直接报
  #   "device 'XXX' not found"，或者悄悄操作到别的设备上。
  serial: ""
  screen_resolution: [1080, 2400]   # 坐标基准分辨率（仅作参考，实际由 adb 探测）

# 英语宝APP
app:
  package: "com.dinoenglish.yyb"    # APP包名 (英语宝)
  # activity: ""                    # 启动Activity (留空则用monkey启动)

# 灰度账号（如改用其他账号，建议写到 .env 的 YYB_USERNAME / YYB_PASSWORD 覆盖）
account:
  username: "10010005"
  password: "123456"

# 输出配置
output:
  dir: "outputs"                    # 输出根目录
  screenshot_dir: "outputs/screenshots"
  save_pass_screenshots: false      # 是否保存通过题目的截图
  question_timeout: 120             # 单题超时(秒)
  max_retries: 2                    # 最大重试次数

# 运行环境自适应
runtime:
  # 模拟器/低性能设备的超时倍数（真机=1.0）。模拟器渲染与响应明显更慢，
  # 用真机的超时会频繁误判"控件找不到"，进而把"没测到"写成"不通过"。
  emulator_timeout_scale: 2.0

# 流程引擎配置
flow:
  default_timeout: 10               # 默认等待超时(秒)
  poll_interval: 1.0                # 轮询间隔(秒)
  step_delay: 0.5                   # 步骤间延迟(秒)

# 参考图片目录 (可选, 可配置多个)
# 审查时会加载这些目录下所有 U6图片/ U7图片/... 子目录的图片
# AI将参考图与APP截图做对比, 提高配图判断准确度
#
# ⚠ 必须是**本机可访问**的路径。指向原作者电脑的绝对路径时，别人机器上
#   永远读不到，视觉配图核对会静默降级（报告里却看不出来）。
#   建议把图放到项目内相对路径（uploads/ref_images/U6图片/...），
#   这样随仓库一起走，换电脑不用改配置。
#   也可用 .env 的 YYB_IMAGE_DIR 追加（多个用 ; 分隔，不入库）。
image_dir:
  - 'uploads/ref_images'
  - 'D:\压缩包存储\听力专项新湘鲁五上U6-9'    # 仅作者本机存在；缺失时只告警
  - 'D:\压缩包存储\听力专项新湘鲁六上U6-9'
